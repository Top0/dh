spring:
  application:
    name: dh
  cache:
    redis:
      time-to-live: 180000 #设置缓存过期时间
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password:
      jedis:
        pool:
          max-idle: 100  #redis连接池中空闲连接的最大数量
          min-idle: 1
          max-active: 1000   #redis连接池中可同时使用的最大连接数
          max-wait: -1  #redis连接池中没有可用连接时，最大的等待时间


